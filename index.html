 const rows=[['City',p.city],['Gender',p.gender],['Interested in',p.interested_in],['Looking for',p.looking_for],['Email',p.email],['Phone',p.phone],['Bio',p.bio||'Not filled'],['Activities',(p.tags||[]).join(', ')],['Photo',p.avatar_url?'Uploaded':'None'],['Selfie',p.verify_path?'Submitted':'Not submitted'],...(p.needs_verify?[['Voice check',p.voice_path?'Submitted':'Not submitted'],['Voice code',p.voice_code||'—']]:[])];
 const o=document.createElement('div');o.id='rv';o.className='rv';
 o.innerHTML=`<div class="rvp"><div class="section-head" style="margin-top:0"><h2>${esc(p.name)}, ${p.age}</h2><button class="small-link" onclick="closeReview()">Close</button></div>
 ${p.avatar_url?`<img class="rvimg" src="${esc(p.avatar_url)}" alt="">`:'<div class="panel">No profile photo uploaded.</div>'}
 ${p.verify_path?`<button class="btn secondary" style="width:100%;margin-top:10px" onclick="viewSelfie('${esc(p.verify_path)}')">View selfie</button>`:''}
 ${p.voice_path?`<button class="btn secondary" style="width:100%;margin-top:10px" onclick="viewVoice('${esc(p.voice_path)}')">▶ Play voice (code: ${esc(p.voice_code||'')})</button>`:''}
 ${lock?'<div class="panel"><strong>Waiting for user</strong><p style="margin:5px 0 0">Selfie and voice are both needed before approval.</p></div>':''}
 <div class="panel">${rows.map(r=>`<div class="rvrow"><span>${r[0]}</span><b>${esc(r[1]||'—')}</b></div>`).join('')}</div>
 <div class="panel"><strong>Check before approving</strong>${['Photo is clear and shows one real person','Selfie matches the profile photo','Reverse image search is clean',...(p.needs_verify?['Voice says the code and sounds like a real girl']:[])].map(t=>`<label class="rvchk"><input type="checkbox" onchange="rvGate()"> ${t}</label>`).join('')}</div>
 <button class="btn primary" id="rvOk" style="width:100%" ${lock?'data-lock="1"':''} disabled onclick="rvDo('${p.id}','approve')">Approve</button>
 <div class="grid2" style="margin-top:10px"><button class="btn secondary" onclick="rvShow('rvNeed')">Ask for changes</button><button class="btn secondary" onclick="rvShow('rvRej')">Reject</button></div>
 <div class="panel hidden" id="rvNeed"><div class="field"><label>What should the user fix? (user will see this)</label><textarea id="rvNote" rows="3"></textarea></div><button class="btn primary" style="width:100%" onclick="rvDo('${p.id}','needs_changes')">Send request</button></div>
 <div class="panel hidden" id="rvRej"><div class="field"><label>Reason</label><select id="rvReason"><option value="">Select a reason</option>${REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Note (required for Other)</label><textarea id="rvRN" rows="2"></textarea></div><button class="btn primary" style="width:100%;background:#ff6b6b" onclick="rvDo('${p.id}','rejected')">Confirm reject</button></div></div>`;
 o.onclick=e=>{if(e.target===o)closeReview()};document.body.append(o);
}
function closeReview(){const o=$('rv');if(o)o.remove()}
function rvGate(){$('rvOk').disabled=$('rvOk').dataset.lock==='1'||![...document.querySelectorAll('#rv input[type=checkbox]')].every(c=>c.checked)}
function rvShow(id){['rvNeed','rvRej'].forEach(x=>$(x).classList.toggle('hidden',x!==id||!$(x).classList.contains('hidden')))}
async function rvDo(id,act){
 let u,m;
 if(act==='approve'){u={approved:true,review_status:null,review_note:null};m='Approved'}
 else if(act==='needs_changes'){const n=$('rvNote').value.trim();if(!n)return toast('Write what to fix');u={review_status:'needs_changes',review_note:n};m='Request sent'}
 else{const r=$('rvReason').value,n=$('rvRN').value.trim();if(!r)return toast('Select a reason');if(r==='Other'&&!n)return toast('Add a note for Other');u={review_status:'rejected',review_note:n?r+': '+n:r};m='Rejected'}
 const{error}=await sb.from('profiles').update(u).eq('id',id);
 if(error)return toast(error.message);
 closeReview();toast(m);render();
}
const reviewPanel=p=>p?.review_status?`<div class="panel"><strong>${p.review_status==='rejected'?'Profile was rejected':'Changes needed'}</strong><p style="margin:6px 0 10px">${esc(p.review_note)}</p><button class="btn primary" style="width:100%" onclick="resubmit()">I fixed it, resubmit</button></div>`:'';
async function resubmit(){const{data,error}=await sb.from('profiles').update({review_status:null,review_note:null}).eq('id',me.id).select().single();if(error)return toast(error.message);mp=data;toast('Sent for review again');render()}
async function approve(id){const{error}=await sb.from('profiles').update({approved:true}).eq('id',id);toast(error?error.message:'Approved');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')RECOV=true;if((s?.user?.id||null)!==(me?.id||null))setUser(s?.user)});
setInterval(()=>{if(me)updateBadge()},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
sb.auth.getSession().then(({data})=>setUser(data.session?.user));
</script>
</body></html>
